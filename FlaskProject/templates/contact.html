{% extends "base.html" %}
{% block content %}

<h1 class="mb-4">Contact Us</h1>
<p class="lead">Have questions or need assistance? Send us a message.</p>

{% if success %}
<div class="alert alert-success">
    Your message has been sent!
</div>
{% endif %}

<form class="mt-4" method="POST" action="/contact">
    <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" name="name" placeholder="Your name" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" placeholder="you@example.com" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Message</label>
        <textarea class="form-control" rows="5" name="message" placeholder="How can we help?" required></textarea>
    </div>

    <button class="btn btn-primary" type="submit">Send Message</button>
</form>

{% endblock %}
